baseURL = "https://go-keyring.github.io/"
title = "go-keyring"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[params]
  subtitle = "one secret-store API over three native vaults"
  description = "Pure-Go (CGO_ENABLED=0) cross-platform secret store: one small Set / Get / Delete API backed by the host platform's native credential vault — macOS Keychain, Windows Credential Manager, freedesktop Secret Service. No cgo, no CLI exec."
  tagline = "One small secret-store API — <code>Set</code>, <code>Get</code>, <code>Delete</code> — backed by <strong>the host platform's own credential vault</strong>."
  pills = ["CGO_ENABLED=0", "no CLI exec", "macOS · Windows · freedesktop", "BSD-3-Clause"]
  primary_role = "façade"
  secondary_url = "https://pkg.go.dev/github.com/go-keyring/keyring"
  secondary_label = "Go reference"
  leads = [
    "A program that needs to keep a token should not have to know which vault the machine happens to run. This is the façade over the three that matter, with the same three calls on each: the macOS Keychain, the Windows Credential Manager and the freedesktop Secret Service.",
    "<strong>No cgo and no <code>exec</code>.</strong> Both matter for the same reason: a secret handed to a subprocess is visible in that process's <code>argv</code>, and a cgo dependency is the thing that stops a Go binary cross-compiling."
  ]
  principles = "The platform back-ends are the fleet's own CGO-free bindings rather than re-implementations: go-macos/keychain on darwin and go-mswin/win32 on Windows, so the vault access and the rest of the OS surface are built the same way."

[[params.repos]]
  name = "keyring"
  role = "façade"
  reach = "native vault per platform, no cgo"
  gomod = true
  result = "<code>keyring.Set(service, account, secret)</code> and its <code>Get</code> / <code>Delete</code> pair, over the host's native credential store."
  note = "Cross-platform by delegation, not by lowest common denominator: each back-end speaks its own vault's API directly."

[params.brand]
